<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Event Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar bg-dark text-white p-3">
      <h2 class="mb-4">Event Manager</h2>
      <button class="btn btn-light w-100 mb-2" onclick="showSection('events')">View Events</button>
      <button class="btn btn-light w-100 mb-2" onclick="showSection('create')">Create Event</button>
    </div>

    <!-- Main Content -->
    <div class="main-content p-4">
      <!-- View Events -->
      <div id="event-section">
        <h3>All Events</h3>
        <input type="text" id="search" class="form-control my-3" placeholder="Search events..." />
        <div id="event-list" class="row"></div>
      </div>

      <!-- Create Event -->
      <div id="create-section" style="display: none;">
        <h3>Create New Event</h3>
        <form id="create-event-form" class="row g-3">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Event Title" id="event-title" required />
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Location" id="event-location" required />
          </div>
          <div class="col-md-6">
            <input type="date" class="form-control" id="event-date" required />
          </div>
          <div class="col-md-12">
            <textarea class="form-control" placeholder="Description" id="event-description" rows="3" required></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Create Event</button>
          </div>
        </form>
      </div>

      <!-- Registration Form with QR Code -->
      <div id="register-section" style="display: none;">
        <h3>Register for Event</h3>
        <form id="user-form">
          <input type="text" class="form-control mb-2" placeholder="Name" required />
          <input type="email" class="form-control mb-2" placeholder="Email" required />
          <button class="btn btn-primary">Submit & Show QR</button>
        </form>
        <div id="qr-section" class="mt-3" style="display: none;">
          <p>Scan this QR code at the venue:</p>
          <div id="qrcode"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
